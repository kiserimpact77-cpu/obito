<style>
:root{--bg:#050406;--panel:rgba(12,9,12,.84);--red:#a91f2c;--red2:#e02d3b;--white:#f5f1f2;--muted:#aaa1a5;--line:rgba(224,45,59,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--white);font-family:Cairo,sans-serif;background:#050406;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-10;background:radial-gradient(circle at 50% 10%,rgba(184,27,42,.23),transparent 24%),radial-gradient(circle at 10% 65%,rgba(113,20,34,.16),transparent 28%),radial-gradient(circle at 90% 75%,rgba(130,18,35,.13),transparent 25%),linear-gradient(180deg,#0b080c,#050406 70%,#080507)}
body:after{content:"";position:fixed;inset:0;z-index:-9;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.75))}
a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}

.nav{position:sticky;top:14px;z-index:20;margin-top:14px;height:68px;border:1px solid #ffffff1a;border-radius:20px;background:#050406ba;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 15px 50px #00000055}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:1px}.brand-mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--red2);display:grid;place-items:center;color:var(--red2);font-size:19px}.brand span{color:var(--red2)}
.navlinks{display:flex;gap:28px;color:#bdb7ba;font-size:14px}.navlinks a{padding:23px 0;position:relative}.navlinks a:hover,.navlinks a.active{color:#fff}.navlinks a.active:after{content:"";position:absolute;bottom:0;right:0;left:0;height:2px;background:var(--red2);box-shadow:0 0 12px var(--red2)}
.search{width:255px;height:43px;border:1px solid #e02d3baa;border-radius:24px;display:flex;align-items:center;padding:0 14px;color:#777;background:#05040688}.search input{width:100%;background:none;border:0;outline:0;color:#ddd;font-family:inherit;text-align:right}

.hero{padding:105px 0 65px;text-align:center;position:relative}.eyebrow{color:#d02a38;font-size:13px;letter-spacing:3px;font-weight:800}.hero h1{font-size:clamp(48px,7vw,82px);margin:12px 0 8px;font-weight:900}.hero h1 span{color:var(--red2)}.hero p{max-width:650px;margin:auto;color:var(--muted);line-height:2}

.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#140c10e8,#070608ed);box-shadow:0 20px 70px #00000040;overflow:hidden}
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding-bottom:90px}
.project{overflow:hidden;transition:.25s;cursor:pointer}.project:hover{transform:translateY(-6px);border-color:#e02d3b88;box-shadow:0 25px 70px #a91f2c22}
.preview{height:340px;background:#020203;border-bottom:1px solid var(--line);position:relative}.preview iframe{width:100%;height:100%;border:0}.preview:after{content:"LIVE PREVIEW";position:absolute;top:13px;left:13px;padding:4px 9px;border:1px solid #e02d3b66;border-radius:6px;background:#050406cc;color:#d95a64;font:700 10px Arial;letter-spacing:1px}
.body{padding:22px}.body h2{font-size:21px;margin:0 0 8px}.body p{color:var(--muted);line-height:1.9;font-size:14px;margin:0 0 17px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;color:#c9c0c3;border:1px solid #ffffff12;background:#ffffff05;border-radius:20px;padding:4px 10px}

footer{padding:30px 0;border-top:1px solid #ffffff0f;color:#71696d;text-align:center;font-size:12px}
.cloud{position:fixed;width:220px;height:125px;opacity:.48;filter:drop-shadow(0 0 18px #a91f2c30);pointer-events:none;z-index:-2}.cloud svg{width:100%;height:100%}.cloud path{fill:#751721;stroke:#d4c7c8;stroke-width:5;paint-order:stroke;stroke-linejoin:round}.c1{top:110px;left:-75px;transform:rotate(-8deg)}.c2{top:280px;right:-70px;transform:rotate(9deg) scale(.85)}.c3{bottom:170px;left:-70px;transform:rotate(7deg) scale(.7);opacity:.28}.c4{bottom:40px;right:-60px;transform:rotate(-9deg) scale(.65);opacity:.25}

@media(max-width:900px){.navlinks{gap:15px}.projects{gap:12px}}
@media(max-width:600px){.navlinks{display:none}.hero{padding-top:75px}.preview{height:140px}.projects{gap:10px}.body{padding:14px}.body h2{font-size:15px}.body p{font-size:12px;line-height:1.6;margin-bottom:10px}.tags{gap:5px}.tag{font-size:9px;padding:3px 7px}.search{width:auto;flex:1;margin-right:10px}}
</style>

<script>
(function(){
  const input = document.getElementById('projectSearch');
  const grid = document.getElementById('projectsGrid');
  const noResults = document.getElementById('noResults');
  if(!input || !grid) return;

  function filterProjects(){
    const query = input.value.trim().toLowerCase();
    const cards = grid.querySelectorAll('.project');
    let visibleCount = 0;

    cards.forEach(function(card){
      const titleEl = card.querySelector('.body h2');
      const title = titleEl ? titleEl.textContent.trim().toLowerCase() : '';
      const matches = title.includes(query);
      card.style.display = matches ? '' : 'none';
      if(matches) visibleCount++;
    });

    noResults.style.display = (cards.length > 0 && visibleCount === 0) ? 'block' : 'none';
  }

  input.addEventListener('input', filterProjects);
})();

(function(){
  const grid = document.getElementById('projectsGrid');
  if(!grid) return;

  grid.querySelectorAll('.project').forEach(function(card){
    const link = card.getAttribute('data-link');
    if(!link) return;
    card.addEventListener('click', function(){
      window.open(link, '_blank');
    });
  });
})();
</script>
